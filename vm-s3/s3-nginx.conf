upstream rgw_backend {
    server 127.0.0.1:7480;   # RGW слушает локально без TLS
}

server {
    listen 80;
    server_name {{ vm.hostname }}.{{ domain_name }} s3.{{ domain_name }} *.s3.{{ domain_name }};

    # HTTP → HTTPS redirection
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name {{ vm.hostname }}.{{ domain_name }} s3.{{ domain_name }} *.s3.{{ domain_name }};

    ssl_certificate /usr/ssl/fullchain.crt;
    ssl_certificate_key /usr/ssl/certificate.key;

    # Безопасный набор TLS параметров
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Полезно для больших загрузок S3
    client_max_body_size 0;

    # Path-style access support:
    # https://xx.bdgn.me/bucket/key
    location / {
        proxy_pass http://rgw_backend;

        proxy_set_header Host $host;    # важно!
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;            # отключаем буферы — RGW это любит
        proxy_request_buffering off;    # важно для больших файлов
        proxy_http_version 1.1;

        # Не ломать S3 API
        chunked_transfer_encoding off;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}