## Fallback site with speedtest

# set limit for trottling
#
limit_req_zone " " zone=global:1m rate=5r/s;

server {
        listen 127.0.0.1:20003 proxy_protocol;
        listen 127.0.0.1:20004 proxy_protocol;

        server_name speed.bdgn.me tspeed.bdgn.me;

        http2 on;

        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        access_log /var/log/nginx/speed.access.log;
        error_log /var/log/nginx/speed.error.log;

        client_max_body_size 40M;

        location / {
                resolver 192.168.30.1;
                set $domain speed-test.bdgn.me:3000;
                limit_req zone=global burst=20 nodelay;

                proxy_pass http://$domain;
                proxy_set_header Host             $host;
                proxy_set_header X-Real-IP        $remote_addr;
                proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
}

server {
        listen 127.0.0.1:20006 ssl;

        server_name speed.bdgn.me xspeed.bdgn.me rspeed.bdgn.me;

        http2 on;

        access_log /var/log/nginx/real-speed.access.log;
        error_log /var/log/nginx/real-speed.error.log;

        ssl_certificate /usr/ssl/fullchain.crt;
        ssl_certificate_key /usr/ssl/certificate.key;

        client_max_body_size 40M;

        location / {
                resolver 192.168.30.1;
                set $domain speed-test.bdgn.me:3000;
                limit_req zone=global burst=20 nodelay;

                proxy_pass http://$domain;
                proxy_set_header Host             $host;
                proxy_set_header X-Real-IP        $remote_addr;
                proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
}