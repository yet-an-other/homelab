- name: create lxc container
  hosts: 'prox-n2'
  gather_facts: false
  vars:
    proxmox_node        : "{{ inventory_hostname }}"
    proxmox_password    : "{{ ansible_password }}"
    container_ssh_file  : "{{ ssh_pub_key_file }}"
    container_hostname  : 'sync'
    container_vlan_id   : 20                         # DMZ
    container_ip        : ''
    container_vmid      : 20303
    container_disk_size : 3
    container_memory    : 1024
    container_cores     : 1
    container_user      : 'root'
    container_mount     : 'sync'
    container_nesting   : 1
    homeroot            : "{{ '/root' if container_user == 'root' else '/home/' + container_user }}"

  tasks:
         
    # create basic container
    #
    - import_tasks: ../ansible/create-lxc.yaml

    # create dirs
    #
    - name: create config directory
      delegate_to: "{{ container_hostname }}"
      become: true
      file:
        path: "{{ item }}"
        state: directory
        mode: 0777
      with_items:
        - '/etc/resilio-sync'
        - '/var/run/rslsync'
        - '/mnt/sync/data'
        - '/mnt/sync/downloads'
        - '/mnt/sync/system'

    - name: add nginx
      import_tasks: ../ansible/add-nginx-ubuntu.yaml

    # add repository
    #
    - name: add resilio sync gpg key
      delegate_to: "{{ container_hostname }}"
      become: true
      apt_key:
        url: 'https://linux-packages.resilio.com/resilio-sync/key.asc'
        state: present  

    - name: add resilio sync repo
      delegate_to: "{{ container_hostname }}"
      become: true
      apt_repository:
        repo: 'deb http://linux-packages.resilio.com/resilio-sync/deb resilio-sync non-free'
        state: present
        filename: 'resilio-sync'
        update_cache: yes 

    # install resilio sync
    #
    - name: install resilio sync
      delegate_to: "{{ container_hostname }}"
      become: true
      apt:
        name: resilio-sync
        state: present

    # copy configs
    #
    - name: copy configs
      delegate_to: "{{ container_hostname }}"
      become: true
      copy:
        dest: "{{ item.dest }}"
        force: true
        content: '{{ lookup("template", item.src) }}'
      with_items:
        - { src: 'config.json', dest: '/etc/resilio-sync/config.json' }
        - { src: 'resilio-sync.service', dest: '/lib/systemd/system/resilio-sync.service' }
        - { src: 'nginx.sync.conf', dest: '/etc/nginx/conf.d/sync.conf' }

    # run resilio sync
    #
    - name: enable and start resilio sync
      delegate_to: "{{ container_hostname }}"
      become: true 
      systemd:
        name: resilio-sync
        enabled: yes
        state: started


    ## ssl certificates
    ##
    - import_tasks: ../ansible/add-ssl-certificate.yaml
      vars:
        sites: '-d {{ container_hostname }}.{{ domain_name }}'
        reloadcmd: "sudo systemctl restart nginx"
  

    ## As we set mac_addr, the dhcp will assign the container_ip to the vm
    ##
    - import_tasks: ../ansible/add-local-ssh-config.yaml
      vars:
        hostname: '{{ container_hostname }}'
        host: '{{ container_ip }}'


    
