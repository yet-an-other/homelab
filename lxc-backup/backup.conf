# ==================== PATHS ====================
# Source directory to backup
SOURCE_DIR="/mnt/{{ container_mount }}"

# Backup destination directory
BACKUP_DIR="/mnt/{{ dst_mount }}"

# Log directory (relative to BACKUP_DIR if starts with dot, absolute otherwise)
LOG_DIR=".logs"

# ==================== NAMING ====================
# Prefix for base snapshots
BASE_PREFIX="base-"

# Prefix for increment snapshots
INCREMENT_PREFIX="inc-"

# ==================== LIMITS ====================
# Maximum number of increments before sliding window
MAX_INCREMENTS=30

# ==================== FILTERING ====================
# Filtering mode: "include" or "exclude"
# - "exclude": backup everything except FILTER_PATTERNS
# - "include": backup only FILTER_PATTERNS (and their contents recursively)
FILTER_MODE="include"

# Filter patterns (one per line, supports wildcards)
# For exclude mode: patterns to exclude from backup
# For include mode: patterns to include in backup (paths relative to SOURCE_DIR)
# Examples:
#   - "tmp/" - exclude/include tmp directory
#   - "*.log" - exclude/include all .log files
#   - "cache/*" - exclude/include everything in cache directory
FILTER_PATTERNS=(
    "media/"
    "sync/"
    "syncthing/"
)

# ==================== NTFY NOTIFICATIONS ====================
# Enable/disable ntfy notifications
NTFY_ENABLED=true

# Ntfy server URL and topic
NTFY_URL="https://ntfy.bdgn.me/home-lab"

# ==================== ADVANCED ====================
# Additional rsync options (optional)
# Example: "--bwlimit=10000" to limit bandwidth to 10MB/s
RSYNC_EXTRA_OPTS=""

# Minimum free space in backup directory (in GB) before warning
MIN_FREE_SPACE_GB=10