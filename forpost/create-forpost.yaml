# create-forpost.yaml — configure the forpost cloud VPN entry node (forpost/SPEC.md §9).
#
# Skeleton transport (issue #8) + baseline environment units 00-31 (issue #9)
# + xray (issue #10) + the client-facing path: cert, nginx SNI entry, ufw
# (issue #13) + all traffic chained via alwyzon (issue #11) + full routing:
# bastion outbound and the privileged split (issue #12) + the xform
# monitoring and roster deployment (issue #14).
#
# Ordering note (#13): when the deploy will change anything, nginx is
# brought up FIRST (bootstrap --only 41) so the fallback vhost is live
# before unit 40 restarts xray onto the local dest — xray mirrors dest's
# handshake even for authenticated clients, so xray-first ordering would
# drop clients (post-mortem in #10).
#
# Run via: ./apply.sh forpost
#
# Prerequisites (SPEC §10 runbook):
#   1. Ubuntu VM (x86_64 or arm64) created at any provider, with
#      forpost/user-data.yaml pasted as user-data
#   2. Manual A record: forpost.domain -> VM public IP
#   3. forpost host entry + vars section (incl. the alwyzon upstream client
#      credentials) in ansible/inventory.secret.yaml (shape documented in
#      ansible/template-proxmox-inventory.yaml)
#   4. Manual gates (#11/#12): forpost's client UUIDs added to alwyzon's and
#      bastion's xray (bastion's is vm-bastion/)
#
# Re-running a subset of units:
#   ansible-playbook -i ansible/inventory.secret.yaml forpost/create-forpost.yaml -e "forpost_bootstrap_args='--from 40'"
#
# Idempotency (SPEC §9): bootstrap only runs when the pushed bundle changed or
# forpost_bootstrap_args is given — a second ./apply.sh forpost on an
# unchanged node reports no changes.
---
- name: configure forpost vpn entry node
  hosts: forpost
  become: yes
  gather_facts: true
  vars:
    forpost_bootstrap_args: ""
    forpost_home: /usr/local/sbin/forpost
  tasks:
    - name: wait for ssh on port 42318
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: validate the forpost secrets shape (SPEC §3/§6)
      ansible.builtin.assert:
        that:
          - forpost.domain | length > 0
          - forpost.server_name | length > 0
          # optional backup entry point: must not duplicate the primary names
          - forpost.backup_domain is not defined or forpost.backup_domain != forpost.domain
          - forpost.backup_domain is not defined or forpost.backup_domain != forpost.server_name
          - forpost.private_key | length > 0
          - forpost.short_ids | length > 0
          - forpost.users | length > 0
          - forpost.users | selectattr('name', 'undefined') | list | length == 0
          - forpost.users | selectattr('uuid', 'undefined') | list | length == 0
          - forpost.users | selectattr('privileged', 'undefined') | list | length == 0
          - >-
            (forpost.users | map(attribute='name') | list | length)
            == (forpost.users | map(attribute='name') | unique | list | length)
          # canonical dashed uuids: the template derives the bastion marker
          # by splitting on '-'; xray also accepts dashless forms (research Q5)
          - >-
            (forpost.users | map(attribute='uuid')
               | select('match', '^[0-9a-fA-F-]{36}$') | list | length)
            == forpost.users | length
          - forpost.users | selectattr('privileged') | list | length > 0
            # empty privileged list would make the bastion rules match everyone
          - forpost.alwyzon is defined
          - forpost.alwyzon.address | length > 0
          - forpost.alwyzon.port | int > 0
          - forpost.alwyzon.uuid | length > 0
          - forpost.alwyzon.server_name | length > 0
          - forpost.alwyzon.public_key | length > 0
          - forpost.alwyzon.short_id | length > 0
          - forpost.bastion is defined
          - forpost.bastion.address | length > 0
          - forpost.bastion.port | int > 0
          - forpost.bastion.uuid is match('^[0-9a-fA-F-]{36}$')
          - forpost.bastion.server_name | length > 0
          - forpost.bastion.public_key | length > 0
          - forpost.bastion.short_id | length > 0
        fail_msg: >-
          forpost vars incomplete: domain, server_name, private_key,
          short_ids, users (each with a unique name and a uuid) and the
          alwyzon + bastion upstream client sections (address, port, uuid,
          server_name, public_key, short_id) are required — see
          ansible/template-proxmox-inventory.yaml
        quiet: true

    - name: validate the cert-issuance inputs (SPEC §7)
      ansible.builtin.assert:
        that:
          - ntfy_url is defined and ntfy_url | length > 0
          - ntfy_topic is defined and ntfy_topic | length > 0
          - cf_token is defined and cf_token | length > 0
          - cf_zone_id is defined and cf_zone_id | length > 0
        fail_msg: >-
          ntfy_url, ntfy_topic, cf_token and cf_zone_id are required for the
          Cloudflare DNS-challenge cert — see the vpn group vars in
          ansible/template-proxmox-inventory.yaml
        quiet: true

    - name: create forpost staging directory
      ansible.builtin.file:
        path: "{{ forpost_home }}"
        state: directory
        mode: "0755"

    - name: push bootstrap.sh and units
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
      loop:
        - { src: "bootstrap.sh", dest: "{{ forpost_home }}/bootstrap.sh" }
        - { src: "units/", dest: "{{ forpost_home }}/units" }
      register: forpost_push

    - name: issue the TLS cert for the node domain (SPEC §7)
      import_tasks: ../ansible/add-ssl-certificate.yaml
      vars:
        container_hostname: "{{ inventory_hostname }}"
        # one SAN cert: primary + optional backup domain (SPEC §6/§7) — the
        # fallback vhost serves both names, so the cert must cover them all
        sites: >-
          -d {{ forpost.domain }}
          {%- if forpost.backup_domain is defined %} -d {{ forpost.backup_domain }}{% endif %}
        # nginx may not be running on first issuance; 41-nginx starts it
        reloadcmd: "systemctl reload nginx || true"

    - name: assert the PROXY protocol pairs are in lockstep before anything flips
      ansible.builtin.command: "{{ playbook_dir }}/tests/proxy-protocol.sh"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: create the xray config directory
      ansible.builtin.file:
        path: /usr/local/etc/xray
        state: directory
        owner: root
        group: root
        # The named xform ACL uses an rwx mask, which stat reports as group rwx.
        # The owning group remains root, so this grants no additional principal.
        mode: "0775"

    - name: render the xray config before units run (SPEC §9)
      ansible.builtin.template:
        src: templates/xray-config.json.j2
        dest: /usr/local/etc/xray/config.json
        owner: root
        group: nogroup  # the official installer's xray.service runs as User=nobody
        mode: "0640"    # embeds the Reality private key; not world-readable
      register: forpost_xray_config

    - name: create the nginx staging directory
      ansible.builtin.file:
        path: "{{ forpost_home }}/nginx"
        state: directory
        mode: "0755"

    - name: render the nginx confs into staging (SPEC §9 — units place them)
      ansible.builtin.template:
        src: "templates/{{ item }}.j2"
        dest: "{{ forpost_home }}/nginx/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - nginx.conf
        - default.conf
        - fallback.conf
        - xform.conf
      register: forpost_nginx_render

    - name: create the xform staging directory
      ansible.builtin.file:
        path: "{{ forpost_home }}/xform"
        state: directory
        mode: "0755"

    - name: render the xform service into staging
      ansible.builtin.template:
        src: templates/xform.service.j2
        dest: "{{ forpost_home }}/xform/xform.service"
        owner: root
        group: root
        mode: "0644"
      register: forpost_xform_service

    - name: bring nginx up before xray moves behind it (SPEC §7 ordering)
      ansible.builtin.command: "{{ forpost_home }}/bootstrap.sh --only 41"
      when: forpost_push is changed
        or forpost_xray_config is changed
        or forpost_nginx_render is changed
        or forpost_xform_service is changed
        or forpost_bootstrap_args | length > 0

    - name: run forpost bootstrap
      ansible.builtin.command: "{{ forpost_home }}/bootstrap.sh {{ forpost_bootstrap_args }}"
      when: forpost_push is changed
        or forpost_xray_config is changed
        or forpost_nginx_render is changed
        or forpost_xform_service is changed
        or forpost_bootstrap_args | length > 0

    - name: check for an xform release on every run
      ansible.builtin.command: "{{ forpost_home }}/bootstrap.sh --only 43"
      register: forpost_xform_update
      changed_when: >-
        '43-xform: installed ' in forpost_xform_update.stdout
        or '43-xform: placed ' in forpost_xform_update.stdout
        or '43-xform: granted ' in forpost_xform_update.stdout
        or '43-xform: activated ' in forpost_xform_update.stdout

    - name: collect per-unit logs
      ansible.builtin.find:
        paths: /var/log/forpost
        patterns: "*.log"
      register: forpost_unit_logs

    - name: verify xray answers on the client-facing 443
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 443
        timeout: 30
      delegate_to: localhost
      become: false  # runs on the controller; the play-level become needs a sudo password there

    - name: verify the backup domain answers on 443 (manual A record, SPEC §10)
      when: forpost.backup_domain is defined
      ansible.builtin.wait_for:
        host: "{{ forpost.backup_domain }}"
        port: 443
        timeout: 30
      delegate_to: localhost
      become: false

    - name: verify the public xform endpoint
      ansible.builtin.uri:
        url: "https://{{ forpost.domain }}:9443/"
        status_code: 200
        validate_certs: true
      delegate_to: localhost
      become: false

    - name: verify the bootstrap wrote per-unit logs
      ansible.builtin.assert:
        that: forpost_unit_logs.matched > 0
        fail_msg: no per-unit logs in /var/log/forpost — bootstrap did not run any unit
        quiet: true

    - name: collect xray nginx and xform service states
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop:
        - xray
        - nginx
        - xform
      register: forpost_service_state
      changed_when: false

    - name: assert service states
      ansible.builtin.assert:
        that:
          - forpost_service_state.results[0].status.ActiveState == "active"
          - forpost_service_state.results[0].status.UnitFileState == "enabled"
          - forpost_service_state.results[1].status.ActiveState == "active"
          - forpost_service_state.results[1].status.UnitFileState == "enabled"
          - forpost_service_state.results[2].status.ActiveState == "active"
          - forpost_service_state.results[2].status.UnitFileState == "enabled"
        fail_msg: xray/nginx/xform not active+enabled — see journalctl on the node
        quiet: true

    - name: verify the local xform endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/
        status_code: 200

    - name: verify xray StatsService
      ansible.builtin.command: >-
        /usr/local/bin/xray api statsquery --server=127.0.0.1:8080
      changed_when: false

    - name: collect local listening-port facts
      community.general.listen_ports_facts:
        command: ss

    - name: collect xform and StatsService listener addresses
      ansible.builtin.set_fact:
        forpost_xform_listener_addresses: >-
          {{ ansible_facts.tcp_listen
             | selectattr('port', 'equalto', 9090)
             | map(attribute='address') | unique | sort }}
        forpost_stats_listener_addresses: >-
          {{ ansible_facts.tcp_listen
             | selectattr('port', 'equalto', 8080)
             | map(attribute='address') | unique | sort }}

    - name: assert xform and StatsService are loopback only
      ansible.builtin.assert:
        that:
          - forpost_xform_listener_addresses == ['127.0.0.1']
          - forpost_stats_listener_addresses == ['127.0.0.1']
        fail_msg: xform and Xray StatsService must listen on IPv4 loopback only
        quiet: true

    - name: inspect xform path permissions as the service user
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/etc/xray/config.json
        - /usr/local/etc/xray
        - /var/lib/xform
        - /var/lib/forpost/xform
      become_user: xform
      register: forpost_xform_paths

    - name: assert xform path permissions
      ansible.builtin.assert:
        that:
          - forpost_xform_paths.results[0].stat.readable
          - forpost_xform_paths.results[1].stat.writeable
          - forpost_xform_paths.results[1].stat.executable
          - forpost_xform_paths.results[2].stat.writeable
          - not forpost_xform_paths.results[3].stat.writeable
        fail_msg: xform must have roster write access and isolated application state
        quiet: true

    - name: assert xform systemd hardening
      ansible.builtin.assert:
        that:
          - forpost_service_state.results[2].status.User == "xform"
          - forpost_service_state.results[2].status.NoNewPrivileges == "yes"
          - forpost_service_state.results[2].status.ProtectSystem == "strict"
          - "'/usr/local/etc/xray' in forpost_service_state.results[2].status.ReadWritePaths"
        fail_msg: xform must run unprivileged with the expected systemd hardening and xray write path
        quiet: true

    - name: verify the firewall is locked down (SPEC §5)
      ansible.builtin.command: ufw status
      register: forpost_ufw_status
      changed_when: false

    - name: collect the allowed ufw rules
      ansible.builtin.set_fact:
        forpost_ufw_allowed: >-
          {{ forpost_ufw_status.stdout_lines
             | select('search', 'ALLOW')
             | map('regex_replace', '^(\S+)( \(v6\))?\s+ALLOW.*$', '\1')
             | unique | sort }}

    - name: assert ufw exposes only ssh the VPN entry and xform
      ansible.builtin.assert:
        that:
          - "'Status: active' in forpost_ufw_status.stdout"
          - forpost_ufw_allowed == ["42318/tcp", "443/tcp", "9443/tcp"]
        fail_msg: >-
          ufw must be active with only 42318/tcp, 443/tcp and 9443/tcp allowed —
          got: {{ forpost_ufw_status.stdout }}
        quiet: true
