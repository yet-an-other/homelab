- name: Install Helm
  become: true
  block:
    - name: Check if Helm is already installed
      shell: "helm version --short 2>/dev/null || echo 'not_installed'"
      register: helm_check
      changed_when: false
      failed_when: false
      environment:
        PATH: "/usr/local/bin:{{ ansible_env.PATH }}"

    - name: Install Helm
      when: "'not_installed' in helm_check.stdout"
      block:
        - name: Download Helm installation script
          get_url:
            url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            dest: /tmp/get_helm.sh
            mode: '0700'

        - name: Install Helm
          shell: /tmp/get_helm.sh
          environment:
            DESIRED_VERSION: v3.16.3
            PATH: "/usr/local/bin:{{ ansible_env.PATH }}"

        - name: Remove installation script
          file:
            path: /tmp/get_helm.sh
            state: absent

    - name: Verify Helm installation
      shell: "helm version --short"
      register: helm_version
      changed_when: false
      environment:
        PATH: "/usr/local/bin:{{ ansible_env.PATH }}"

    - name: Display Helm version
      debug:
        msg: "Helm {{ helm_version.stdout }} installed successfully"
