- name: create lxc container
  hosts: 'prox-n2'
  gather_facts: false
  vars:
    proxmox_node        : "{{ inventory_hostname }}"
    proxmox_password    : "{{ ansible_password }}"
    container_ssh_file  : "{{ ssh_pub_key_file }}"
    container_hostname  : 'sponsor-block'
    container_vlan_id   : 20
    container_ip        : ''
    container_vmid      : 20300
    container_disk_size : 4
    container_memory    : 1024
    container_cores     : 1
    container_user      : 'root'
    container_nesting   : 1
  tasks:
    # create basic container
    #
    - import_tasks: ../ansible/create-lxc.yaml

    - import_tasks: ../ansible/add-docker.yaml


    # add config 
    #
    - name: create sponsorblock directory
      delegate_to: "{{ container_hostname }}"
      become: yes
      file: 
        path: ~/sponsorblock
        state: directory
        mode: '0777'

    - name: copy config file
      delegate_to: "{{ container_hostname }}"
      copy:
        dest: ~/sponsorblock/config.json
        content: "{{ lookup('template', 'sponsorblock-config.json') }}"

    - name: run sponsorblock container
      delegate_to: "{{ container_hostname }}"
      become: yes
      shell: |
        docker run -d --name=sponsorblock \
          -v ~/sponsorblock:/app/data \
          -e TZ=Europe/Berlin \
          --restart unless-stopped \
          ghcr.io/dmunozv04/isponsorblocktv:latest

