# Copy this group into inventory.secret.yaml and fill in the values. The A
# record for `domain` stays manual (point it at ansible_host). ntfy_*/cf_* are
# the same values as in the proxmox section above (cert issuance for the
# fallback vhost + notifications). Key material helpers: xray x25519,
# xray x25519 -i <private>, uuidgen — or run forpost/genkeys.sh.
# Multi-node later = more host entries + suffixed vars sections (forpost_fra: …).
