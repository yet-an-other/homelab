- name: set wireguard defaults
  ansible.builtin.set_fact:
    wg_interface: "{{ wireguard_interface | default('wg0') }}"
    wg_listen_port: "{{ wireguard_listen_port | default(51820) }}"
    wg_target_host: "{{ wireguard_target_host | default(container_hostname | default(vm.hostname)) }}"
    wg_post_up: "{{ wireguard_post_up | default([]) }}"
    wg_post_down: "{{ wireguard_post_down | default([]) }}"
    wg_table: "{{ wireguard_table | default('') }}"

- name: validate wireguard parameters
  ansible.builtin.assert:
    that:
      - wg_target_host is defined
      - wireguard_private_key is defined
      - wireguard_private_key | length > 0
      - wireguard_addresses is defined
      - wireguard_addresses | length > 0
      - wireguard_peers is defined
      - wireguard_peers | length > 0
      - wireguard_peers | selectattr('public_key', 'defined') | list | length == wireguard_peers | length
      - wireguard_peers | selectattr('allowed_ips', 'defined') | list | length == wireguard_peers | length

- name: add wireguard
  become: yes
  delegate_to: "{{ wg_target_host }}"
  block:
    - name: install wireguard tools
      ansible.builtin.package:
        name: wireguard-tools
        state: present

    - name: ensure wireguard directory exists
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: configure wireguard interface
      ansible.builtin.copy:
        dest: "/etc/wireguard/{{ wg_interface }}.conf"
        owner: root
        group: root
        mode: '0600'
        content: |
          [Interface]
          PrivateKey = {{ wireguard_private_key }}
          Address = {{ wireguard_addresses | join(', ') }}
          ListenPort = {{ wg_listen_port }}
          {% if wg_table | length > 0 %}
          Table = {{ wg_table }}
          {% endif %}
          {% if wireguard_dns is defined and wireguard_dns | length > 0 %}
          DNS = {{ wireguard_dns | join(', ') if wireguard_dns is sequence and wireguard_dns is not string else wireguard_dns }}
          {% endif %}
          {% for command in wg_post_up if command | length > 0 %}
          PostUp = {{ command }}
          {% endfor %}
          {% for command in wg_post_down if command | length > 0 %}
          PostDown = {{ command }}
          {% endfor %}
          {% for peer in wireguard_peers %}

          [Peer]
          PublicKey = {{ peer.public_key }}
          AllowedIPs = {{ peer.allowed_ips | join(', ') if peer.allowed_ips is sequence and peer.allowed_ips is not string else peer.allowed_ips }}
          {% if peer.preshared_key is defined and peer.preshared_key | length > 0 %}
          PresharedKey = {{ peer.preshared_key }}
          {% endif %}
          {% if peer.endpoint is defined and peer.endpoint | length > 0 %}
          Endpoint = {{ peer.endpoint }}
          {% endif %}
          {% if peer.persistent_keepalive is defined %}
          PersistentKeepalive = {{ peer.persistent_keepalive }}
          {% endif %}
          {% endfor %}
      register: wireguard_config

    - name: enable and start wireguard
      ansible.builtin.service:
        name: "wg-quick@{{ wg_interface }}"
        enabled: yes
        state: started

    - name: restart wireguard after config change
      ansible.builtin.service:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted
      when: wireguard_config is changed
