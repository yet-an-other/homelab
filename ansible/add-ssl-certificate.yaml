## Input:
# - ntfy_url: the url of the ntfy server
# - ntfy_topic: the topic of the ntfy server
# - cf_token: the cloudflare token
# - cf_zone_id: the cloudflare zone id
# - sites: the sites to issue the certificate with the '-d' prefix, e.g: -d example.com -d www.example.com
# - reloadcmd: the command to reload the service after the certificate is issued
#               e.g: 'sudo systemctl restart nginx' for ubuntu or 'rc-service nginx restart' for alpine
#
- name: add ssl certificate
  delegate_to: "{{ container_hostname }}"
  become: yes
  block:
    - name: create ssl directory
      file:
        path: /usr/ssl
        state: directory

    - name: install acme.sh
      shell: |
        curl https://get.acme.sh | sh
      args:
        creates: ~/.acme.sh

    - name: register notification
      no_log: true
      shell: |
        export NTFY_URL={{ ntfy_url }}
        export NTFY_TOPIC={{ ntfy_topic }}
        ~/.acme.sh/acme.sh --set-notify --notify-hook ntfy
      ignore_errors: yes
      args:
        creates: /usr/ssl/fullchain.crt      

    - name: issue certificate
      # Idempotency guard: file existence is not enough. If the requested
      # names change (e.g. a domain rename in inventory), the certificate
      # must be re-issued even though /usr/ssl/fullchain.crt already exists
      # (post-mortem: cert silently kept covering the old domain after a
      # rename). Skip only when the deployed cert covers EVERY requested name.
      no_log: true
      shell: |
        export CF_Token="{{ cf_token }}"
        export CF_Zone_ID="{{ cf_zone_id }}"
        covered=1
        for name in {{ sites }}; do
          case "$name" in -d) continue ;; esac
          if [ -f /usr/ssl/fullchain.crt ] && \
             openssl x509 -in /usr/ssl/fullchain.crt -noout -ext subjectAltName 2>/dev/null | \
             grep -qw -- "$name"; then
            continue
          fi
          covered=0
        done
        if [ "$covered" = 1 ]; then
          echo "certificate already covers all requested names"
          exit 0
        fi
        ~/.acme.sh/acme.sh --issue \
        {{ sites }} \
        --force \
        --dns dns_cf \
        --server letsencrypt.org  \
        --key-file /usr/ssl/certificate.key \
        --fullchain-file /usr/ssl/fullchain.crt \
        --reloadcmd "{{ reloadcmd }}"
      register: ssl_cert_issue
      changed_when: "'already covers' not in ssl_cert_issue.stdout"
# --server letsencrypt.org
