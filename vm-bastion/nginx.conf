user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}

## mod stream configuration
##
stream {

        log_format stream '$remote_addr - - [$time_local] $protocol '
                    '$status $bytes_sent $bytes_received '
                    '$upstream_addr "$ssl_preread_server_name" '
                    '"$ssl_preread_protocol" "$ssl_preread_alpn_protocols"';

        access_log /var/log/nginx/stream.log stream;
        error_log /var/log/nginx/stream.error.log;

        resolver 192.168.20.1 valid=30s;

        map $ssl_preread_server_name $upstream_map {

                default                           main; # must be first entry
                
                rspeed.{{ domain_name }}          vless-reality;
                xspeed.{{ domain_name }}          vless-xhttp;
                speed.{{ domain_name }}           speed;
                plex.{{ domain_name }}            plex;
                ntfy.{{ domain_name }}            ntfy;
                immich.{{ domain_name }}          immich;
                s3.{{ domain_name }}              s3;
                syncthing.{{ domain_name }}       syncthing;
                klawa.{{ domain_name }}           klawa;
                ha.{{ domain_name }}              homeassistant;
        }
        

        upstream main {
                server 127.0.0.1:20000; # default site
        }

        upstream speed{
                server 127.0.0.1:20002; # fallback speedtest site, change to 20001 for proxy protocol support
        }

        upstream vless-reality {
                server 127.0.0.1:20012;
        }

        upstream vless-xhttp {
                server 127.0.0.1:20013; # vless-xhttp -> vpn
        }

        upstream plex {
                zone plex_zone 64k;
                server plex-lxc.{{ domain_name }}:443 resolve; # Plex media server
        }

        upstream ntfy {
                zone ntfy_zone 64k;
                server ntfy.{{ domain_name }}:443 resolve; # ntfy.sh server
        }

        upstream immich {
                zone immich_zone 64k;
                server immich.{{ domain_name }}:443 resolve; # immich server
        }

        upstream s3 {
                zone s3_zone 64k;
                server s3-node.{{ domain_name }}:443 resolve; # S3 server
        }

        upstream syncthing {
                zone syncthing_zone 64k;
                server syncthing.{{ domain_name }}:443 resolve; # Syncthing server
        }

        upstream klawa {
                zone klawa_zone 64k;
                server klawa.{{ domain_name }}:443 resolve; # Klawa server
        }

        upstream homeassistant {
                zone homeassistant_zone 64k;
                server homeassist.{{ domain_name }}:443 resolve; # Home Assistant server
        }

        server {
                listen 443      reuseport;
                listen [::]:443 reuseport;
                proxy_pass      $upstream_map;
                ssl_preread     on;
                #proxy_protocol  on;

                proxy_connect_timeout 10s;
                proxy_timeout 1h;
                proxy_socket_keepalive on;
                proxy_half_close on;
        }
}
