- name: set variables for vm creation
  hosts: 'prox-n3'
  gather_facts: true
  vars:
    proxmox:
      node              : "{{ inventory_hostname }}"    
      password          : "{{ ansible_password }}"
    vm:
      type              : "alma"
      template          : 'alma10-template'
      hostname          : 'bastion'
      vlan_id           : 20
      ip                : '192.168.20.250'
      id                : 20250
      memory            : 1024
      cores             : 1
      disk_size         : '10G'
      mac               : 'BC:24:12:00:22:50'
      tag_name          : 'dmz'
    settings:
      fallback_host     : 'speed-test'

  tasks:
    - name: create and preconfigure alma vm
      import_tasks: ../ansible/create-vm.yaml

    ## As we set mac_addr, the dhcp will assign the container_ip to the vm
    ##
    - import_tasks: ../ansible/add-local-ssh-config.yaml
      vars:
        user: 'ib'
        hostname: '{{ vm.hostname }}'
        host: '{{ vm.ip }}'      

    - name: add "{{ vm.hostname }}" to inventory
      add_host:
        name: '{{ vm.hostname }}'
        ansible_python_interpreter: 'auto_silent'
        ansible_host: '{{ vm.ip }}' ## dhcp should assign the ip based on mac
        ansible_user: 'ib'
        ansible_ssh_private_key_file: '{{ ansible_ssh_private_key_file }}'
      changed_when: false

    - name: wait for ssh connection to {{ vm.hostname }}
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: add eza to alma vm
      import_tasks: ../ansible/add-eza-alma.yaml
      vars:
        container_hostname: '{{ vm.hostname }}'

    - name: configure bastion userland
      delegate_to: "{{ vm.hostname }}"
      block:
        - import_tasks: ../ansible/set-zsh-default.yaml
        - import_tasks: ../ansible/add-neovim.yaml
      vars:
        managed_user: ib
        managed_home: /home/ib

    - name: add nginx to alma vm
      import_tasks: ../ansible/add-nginx-alma.yaml
      vars:
        hostname: '{{ vm.hostname }}'
        fw_ports:
          - { port: 443, proto: tcp }
        se_ports:
          - { port: 20000, proto: tcp }
          - { port: 20001, proto: tcp }
          - { port: 20002, proto: tcp }

    - name: copy main nginx config
      delegate_to: "{{ vm.hostname }}"
      become: yes
      copy:
        dest: /etc/nginx/nginx.conf
        content: "{{ lookup('template', 'nginx.conf') }}"

    - name: copy sites config
      become: yes
      delegate_to: "{{ vm.hostname }}"
      copy:
        dest: /etc/nginx/conf.d/{{ item.dest }}
        content: "{{ lookup('template', item.src) }}"
      loop:
        - { src: 'default.conf', dest: 'default.conf' }
        - { src: 'fallback.conf', dest: 'speed.conf' }

    - name: install xray
      delegate_to: "{{ vm.hostname }}"
      become: yes
      shell: |
        curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip 
        unzip -qq /tmp/xray.zip -d /opt/xray/
        mkdir -p /var/log/xray
        adduser -s /sbin/nologin --no-create-home xrayuser
        chmod +x /opt/xray/xray
        chown -R xrayuser:xrayuser /opt/xray
        chown -R xrayuser:xrayuser /var/log/xray
        setcap cap_net_bind_service=+ep /opt/xray/xray
        rm /tmp/xray.zip
      args:
        creates: /opt/xray/xray

    - name: create xray service
      delegate_to: "{{ vm.hostname }}"
      become: yes
      copy:
        dest: /etc/systemd/system/xray.service
        content: "{{ lookup('template', 'xray.service') }}"
        force: no     

    - name: stage xray config for validation
      delegate_to: "{{ vm.hostname }}"
      become: yes
      no_log: true
      copy:
        dest: /opt/xray/config.new.json
        content: "{{ lookup('template', 'xray-config.json') }}"
        owner: root
        group: xrayuser
        mode: '0640'
        force: yes

    - name: validate staged xray config
      delegate_to: "{{ vm.hostname }}"
      become: yes
      command: /opt/xray/xray -test -c /opt/xray/config.new.json
      changed_when: false

    - name: update xray config
      delegate_to: "{{ vm.hostname }}"
      become: yes
      no_log: true
      register: xray_config
      copy:
        dest: /opt/xray/config.json
        remote_src: yes
        src: /opt/xray/config.new.json
        owner: root
        group: xrayuser
        mode: '0640'
        force: yes

    - name: restart xray on config change
      delegate_to: "{{ vm.hostname }}"
      become: yes
      when: xray_config.changed
      service:
        name: xray
        state: restarted

    - name: enable xray, start after certs are in place
      delegate_to: "{{ vm.hostname }}"
      become: yes
      service:
        name: xray
        enabled: yes


    - name: install openssl
      delegate_to: "{{ vm.hostname }}"
      become: yes
      dnf:
        name: openssl
        state: present

    ## ssl certificates
    ##
    - import_tasks: ../ansible/add-ssl-certificate.yaml
      vars:
        sites: '-d {{ domain_name }} -d speed.{{ domain_name }} -d rspeed.{{ domain_name }} -d xspeed.{{ domain_name }}'
        container_hostname: '{{ vm.hostname }}'
        reloadcmd: "sudo chown -R xrayuser:xrayuser /usr/ssl && sudo chmod g+rwx -R /usr/ssl/ && sudo systemctl restart nginx && sudo systemctl restart xray"
  
