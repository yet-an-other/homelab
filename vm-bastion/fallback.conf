server {
        listen 127.0.0.1:20002 ssl;

        server_name speed.{{ domain_name }} xspeed.{{ domain_name }} rspeed.{{ domain_name }};

        http2 on;

        access_log /var/log/nginx/fallback.access.log;
        error_log /var/log/nginx/fallback.error.log;

        ssl_certificate /usr/ssl/fullchain.crt;
        ssl_certificate_key /usr/ssl/certificate.key;

        client_max_body_size 40M;

        location / {
                resolver 192.168.20.1;
                set $domain speed-test.{{ domain_name }}:3000;
                limit_req zone=global burst=20 nodelay;

                proxy_pass http://$domain;
                proxy_set_header Host             $host;
                proxy_set_header X-Real-IP        $remote_addr;
                proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
}
