upstream proxmox_cluster {
    ip_hash;
    server {{ hostvars['prox-n1'].ansible_host | default('prox-n1') }}:8006 max_fails=2 fail_timeout=10s;
    server {{ hostvars['prox-n2'].ansible_host | default('prox-n2') }}:8006 max_fails=2 fail_timeout=10s;
    server {{ hostvars['prox-n3'].ansible_host | default('prox-n3') }}:8006 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name proxmox.{{ domain_name }};

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name proxmox.{{ domain_name }};
    http2 on;

    ssl_certificate /usr/ssl/fullchain.crt;
    ssl_certificate_key /usr/ssl/certificate.key;

    proxy_redirect off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass https://proxmox_cluster;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;

        proxy_buffering off;
        client_max_body_size 0;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
